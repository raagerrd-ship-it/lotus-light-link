[Service]
# 2026-09-23 GRIDFASENS KONSTANT (anvandarens beslut efter morgonrapporten).
# Gridet rapporterade slaget ~15 ms FOR SENT mot ML-slagen (Beat This!). Bevisat sa har: fastrimmen mot de
# senaste 8 kickarna (LOTUS_GRID_PHASE_TRIM) flyttade ingenting (+15 -> +16 ms) => kickarna ligger i SAMMA fas
# som gridet, dvs. hela onset-fronten ar sen - ett matfel i detektorn (10 ms envelope-hinkar + max over +-1
# sampel), inte ett fasfel att folja. Kedjans 30 ms (klapp + 240 fps) ar en ANNAN sak och kompenseras inte.
# KORBANK 145 korpuslatar, live-flaggor, foljar-emulering mot Beat This!:
#   0 ms:  offset-median +15, |offset| 22, andel |offset| <= 30 ms 0,63
#  15 ms:  offset-median  +2, |offset| 21, andel 0,73          <- valt: medianen pa noll, pulsen leder aldrig
#  22 ms:  offset-median  -4, |offset| 17, andel 0,74          (lagre |offset| men pulsen hamnar fore slaget)
# Tempo 114/145 och syntet 6/8 identiska i alla tre; kick 0,89/0,82 och on-beat 0,93 oforandrade.
# Effekt pa ogat: pulsen lag fore detta pa slaget +15 +30 (kedjan) = +45 ms medan nivakanalen reagerar vid +30.
# Konstanten flyttar pulsen till +30 = SAMMA plats som nivakanalen, sa de staplar som det var tankt.
# Atergang: ta bort filen, daemon-reload, restart.
Environment=LOTUS_GRID_PHASE_OFFSET_MS=15
