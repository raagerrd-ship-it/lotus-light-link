[Service]
# lotus-light ar masterprocessen pa den har maskinen: 75 Hz ljud->ljus far
# inte trangas undan. Nice=-15 ger stark CPU-foretradesratt utan de risker
# hard realtidsschemalaggning (SCHED_FIFO/RR) innebar for en Node-process:
# en spinnande RT-trad kan svalta systemet. IO-prioritet i realtidsklass sa
# loggskrivningar aldrig blockerar slingan.
Nice=-15
IOSchedulingClass=realtime
IOSchedulingPriority=0
