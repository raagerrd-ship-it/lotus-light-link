[Service]
# 2026-10-02: --no-flush-bytecode - stallar 250-530 ms de forsta 15 s av varje session efter idle (V8 kastar oanvand bytekod; omkompilering nar musiken borjar).
# 2026-09-30: heap-gransen verkade aldrig - ExecStart satte --max-old-space-size=224 och vann over NODE_OPTIONS=144 (morgonagenten 09-30:
# 48 GC-pauser >= 20 ms kvall 16-24, max 66 ms). Samma fix som ladan 09-29 (200 -> 96 + fast semi-space 4 MB: max 111 -> 45 ms), men 144 har.
# 19:40: --expose-gc for full GC i tysta ogonblick (LOTUS_GC_QUIET_MS i gc-quiet.conf).
Environment=NODE_OPTIONS=
ExecStart=
ExecStart=/usr/bin/node --max-old-space-size=144 --min-semi-space-size=4 --max-semi-space-size=4 --expose-gc --no-flush-bytecode /opt/lotus-light/pi/dist/index.js
