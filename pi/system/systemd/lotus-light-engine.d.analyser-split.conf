[Service]
# 2026-09-21 DELAD ANALYSATOR (pi/src/audio-analyser/split.ts): tempo/gridfas/sektion/upprepning kors i en
# worker_threads-Worker med egen V8-heap pa egen karna; ljudvagen (FFT, band, onset, kick, niva, drop) blir kvar i
# huvudtraden. Bevisat bit-identiskt mot odelad analysator i korbanken (tools/tempo-facit-pc/splitProof.mjs, 135 000 hop).
# Halsa: /api/live analyserCost.split { behind, lagMs, lagMaxMs, busyUs, skipped }. Tom/borttagen = odelad som forr.
# Kopia av /etc/systemd/system/lotus-light-engine.service.d/analyser-split.conf pa Pi:n.
Environment=LOTUS_ANALYSER_SPLIT=worker
# Workern behover en EGEN karna: unit-filen laser motorn till karna 1 (CPUAffinity + cgroup AllowedCPUs). Karna 2 ar ledig
# (0 = bakgrund/nginx/ui, 3 = blewatch). Tom rad nollar masken, sedan 1 2. Matt utanfor tjansten (tools/tempo-facit-pc/
# splitBenchPi.mjs, Zero 2 W, realtidstakt): process() i huvudtraden 820 -> 476 us medel, hop over 2,67 ms 615 -> 187 av
# 9 376, max 47 -> 9,6 ms, timerlagg 81 -> 14 ms. Verifierat 21:37: taskset 1,2 pa MainThread och WorkerThread.
CPUAffinity=
CPUAffinity=1 2
AllowedCPUs=1 2
# 2026-09-21 23:10 upprepningsminne v2 (agent-sec3, bitmask: 1 avtryck z-normerat, 16/32 uppehall i high ur minne+prior, 64 lag-intrade,
# 4 lag-forutsagelse): bank 9 -> 11/22 refrangstarter forutsedda, 2,0 -> 2,8 falska/min, sektionsmatten oforandrade (0,25/0,60/0,73/0,41).
# OBS repeatSim byter betydelse (0,2-0,9, inte 0,92-troskeln). Bara lotus - pi-dmx har egen analysatorkopia.
Environment=LOTUS_SECTION_REPEAT=117
# 2026-09-23 10:46 agent S1: hoga bandens absolutniva (bandAbs 3,5-16 kHz, z-normerad mot latens historik) som sardrag i sektionsrangen.
# Test mot bada facit (n 30-40): high==high 0,54->0,57, refrangrecall 0,65->0,71, refrang 2 <=4 s 7->9/30 (median 9,1->7,5 s), falsk high
# oforandrad, kostnad omatbar. Basonset-tathet (librosa-lik) skilde inget (AUC 0,50) - inte pa. Nightly SECTION_ENV speglar detta.
Environment=LOTUS_SECTION_W_HIGH=1.0
