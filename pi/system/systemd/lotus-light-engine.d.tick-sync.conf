[Service]
# 2026-09-21 TICK-SYNK (raster.ts/piEngine.ts): motorn tickar i fas med radions anslutningshandelser (HCI-kvitton)
# i stallet for pa band-ramen, guard ms fore nasta handelse (sjalvsvept 1..16, +2 ms marginal); band-ramen var 3:e hop
# (8 ms) = farskt underlag. Fore (12:11, P=9, sync av): write->kvitto p50 13,6 ms p90 20-22. Efter (12:28, guard 12):
# p50 11,7-12,1 p90 13-22. Svepet: g1-g9 14-21 (missar handelsen), g10 10,9-12,4 => golvet write->radio ~10 ms.
# Atergang: ta bort filen, daemon-reload, restart. Installeras som /etc/systemd/system/lotus-light-engine.service.d/tick-sync.conf
Environment=LOTUS_TICK_SYNC=1
Environment=LOTUS_TICK_SYNC_GUARD_MS=4
Environment=LOTUS_BAND_EVERY_HOPS=3
# 2026-09-21 13:05 KO-TAK 6 -> 2 (RATTELSE av 12:58-noteringen "tak 2 stryper" - den var fel, det var svepets missar).
# btmon 12:48 (tak 6): 8 % av paketen 45-133 ms gamla vid kvitto. Kontrollern kvitterar 2 paket per 35 ms (Count 2).
# btmon 13:00 (tak 3): TX->kvitto 27/45 ms i stallet for 10/28 = ett kvitto sent for VARJE paket: en backlog i kontrollern
# sjalvlaker aldrig eftersom den rasterfasade skrivaren fyller varje frigjord plats. Tak 2 = kon ar 0 efter varje kvitto.
Environment=BLE_ACL_MAX_OUTSTANDING=2
